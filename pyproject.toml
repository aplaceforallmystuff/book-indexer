[project]
name = "book-indexer"
version = "0.2.0"
description = "CLI tool to index books and PDFs into ChromaDB for semantic search"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jim Christian", email = "jim@jimchristian.net"}]
requires-python = ">=3.9"
keywords = ["calibre", "chromadb", "semantic-search", "ebooks", "pdf", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/aplaceforallmystuff/book-indexer"
Repository = "https://github.com/aplaceforallmystuff/book-indexer"
Issues = "https://github.com/aplaceforallmystuff/book-indexer/issues"
dependencies = [
    "chromadb>=0.6.0",
    "pymupdf>=1.24.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
]

[project.scripts]
book-indexer = "book_indexer.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
